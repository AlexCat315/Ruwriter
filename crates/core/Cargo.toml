[package]
name = "ruwriter-core"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
encoding_rs = "0.8.35"
quick-xml = { version = "0.42", features = ["escape-html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
