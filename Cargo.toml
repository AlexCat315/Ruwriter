[package]
name = "ruwriter"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[package.metadata.cove]
id = "dev.cyke.ruwriter"
name = "Ruwriter"
build = 7

[workspace]
members = [".", "crates/core", "xtask"]

[dependencies]
cove-ui = { path = "../Cove" }
ruwriter-core = { path = "crates/core" }
cove-http = { path = "../Cove/crates/http" }
cove-agent = { path = "../Cove/crates/agent", features = ["openai-compatible"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
