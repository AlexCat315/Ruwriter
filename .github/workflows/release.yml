name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COVE_REF: b541b9f0581bf6011677d8000c764cf8cf7334e7
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-26
            platform: mac
            asset: macos-arm64.dmg
          - label: macOS x86_64
            os: macos-26-intel
            platform: mac
            asset: macos-x86_64.dmg
          - label: Windows x64
            os: windows-2025
            platform: windows
            asset: windows-x64-setup.exe
          - label: Linux x64
            os: ubuntu-24.04
            platform: linux
            asset: linux-x64.deb
    defaults:
      run:
        shell: bash
        working-directory: Ruwriter
    steps:
      - name: Check out Ruwriter
        uses: actions/checkout@v4
        with:
          path: Ruwriter
          fetch-depth: 0

      - name: Check out Cove
        uses: actions/checkout@v4
        with:
          repository: AlexCat315/Cove
          ref: ${{ env.COVE_REF }}
          path: Cove
          submodules: recursive

      - name: Apply Cove Agent adapter
        run: |
          # Read the blob straight from Git so the patch keeps its LF endings;
          # Windows runners check text files out as CRLF, which git apply rejects.
          git show HEAD:patches/cove-agent-openai-compatible.patch > ../cove-agent.patch
          git -C ../Cove apply ../cove-agent.patch

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libxcb1-dev libclang-dev libdbus-1-dev libegl-dev libgbm-dev \
            libssl-dev pkg-config nasm fonts-noto-cjk fonts-noto-color-emoji

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pin MSVC linker
        if: runner.os == 'Windows'
        run: printf 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=%sbin\\HostX64\\x64\\link.exe\n' "$VCToolsInstallDir" >> "$GITHUB_ENV"

      - name: Read pinned Zig version
        id: zig
        run: |
          version=$(sed -n 's/^const ZIG_VERSION: &str = "\([^"]*\)";/\1/p' ../Cove/crates/native-build/src/setup.rs)
          test -n "$version" || { echo "ZIG_VERSION missing" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}

      - name: Build desktop package
        run: cargo xtask package ${{ matrix.platform }} --release --output dist

      - name: Verify bundled MSVC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = & dumpbin /nologo /dependents "dist\Ruwriter\ruwriter.exe" |
            Select-String -Pattern '^\s+([A-Za-z0-9_.-]+\.dll)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          $runtime = $deps | Where-Object { $_ -match '^(?i)(vcruntime|msvcp|concrt)' }
          if (-not $runtime) { throw "ruwriter.exe has no MSVC runtime imports" }
          foreach ($dll in $runtime) {
            if (-not (Test-Path (Join-Path "dist/Ruwriter" $dll))) {
              throw "dist/Ruwriter/$dll is missing: cargo xtask package did not stage the MSVC runtime"
            }
          }
          "Bundled MSVC runtime: $($runtime -join ', ')"

      - name: Build macOS dmg
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build-dmg.sh
          bash scripts/build-dmg.sh "dist/Ruwriter.app" "dist/Ruwriter-${RELEASE_TAG}-${{ matrix.asset }}" "Ruwriter"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            choco install innosetup --no-progress -y
          fi
          test -f "$iscc" || { echo "Inno Setup compiler not found" >&2; exit 1; }
          sed -e "s/@APP_VERSION@/${RELEASE_TAG#v}/g" \
              -e "s/@OUTPUT_NAME@/Ruwriter-${RELEASE_TAG}-windows-x64-setup/g" \
              packaging/windows/Ruwriter.iss > packaging/windows/Ruwriter.generated.iss
          "$iscc" packaging/windows/Ruwriter.generated.iss

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-deb.sh
          bash scripts/build-deb.sh dist/Ruwriter "${RELEASE_TAG#v}" amd64 "dist/Ruwriter-${RELEASE_TAG}-${{ matrix.asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: Ruwriter-${{ matrix.label }}
          path: Ruwriter/dist/Ruwriter-${{ github.ref_name }}-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes-${RELEASE_TAG}.md"
          BODY=(--generate-notes)
          if [ -f "$NOTES" ]; then
            BODY=(--notes-file "$NOTES")
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
            fi
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ruwriter $RELEASE_TAG" \
              "${BODY[@]}" \
              --verify-tag
          fi
